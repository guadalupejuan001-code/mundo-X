plugins { id 'com.android.application' }
def cosmic4kStandalone = providers.gradleProperty('cosmic4kStandalone').map { it.toBoolean() }.getOrElse(false)
def cosmic8kStandalone = providers.gradleProperty('cosmic8kStandalone').map { it.toBoolean() }.getOrElse(false)
if (cosmic4kStandalone && cosmic8kStandalone) throw new GradleException('Choose one standalone application identity')
android {
    namespace 'com.mundox.graphics'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId cosmic8kStandalone ? 'com.mundox.graphics.ultra' : cosmic4kStandalone ? 'com.mundox.graphics.uhd' : 'com.mundox.graphics'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
        manifestPlaceholders = [cosmicAppLabel: cosmic8kStandalone ? 'COSMIC X Engine 8K' : cosmic4kStandalone ? 'COSMIC X Engine 4K' : 'COSMIC X Engine']
        testInstrumentationRunner 'com.mundox.graphics.GraphicsInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

// Wear OS Data Layer uses matching application IDs and signing certificates.
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
