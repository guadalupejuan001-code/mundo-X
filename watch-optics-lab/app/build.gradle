plugins {
    id 'com.android.application'
}
def samsungApi = file('libs/samsung-health-sensor-api.aar')
android {
    namespace 'com.mundox.watchoptics'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mundox.watchoptics'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            // Proprietary Samsung SDK is optional and never included in Git.
            if (samsungApi.exists()) java.srcDirs += ['sdk-src']
        }
    }
}
dependencies {
    if (samsungApi.exists()) implementation files(samsungApi)
}
