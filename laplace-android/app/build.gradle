plugins { id 'com.android.application' }
android {
    namespace 'com.mundox.laplace'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mundox.laplace'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.mundox.laplace.LaplaceInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
