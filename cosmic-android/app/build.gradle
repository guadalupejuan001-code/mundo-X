plugins { id 'com.android.application' }

def cosmicStorePath = System.getenv('MUNDOX_SIGNING_STORE')
def cosmicPasswordPath = System.getenv('MUNDOX_SIGNING_PASSWORD_FILE')
def cosmicSigningConfigured = cosmicStorePath && cosmicPasswordPath
if ((cosmicStorePath || cosmicPasswordPath) && !cosmicSigningConfigured) {
    throw new GradleException('COSMIC signing requires both keystore and password-file paths.')
}
if (cosmicSigningConfigured && (!file(cosmicStorePath).isFile() || !file(cosmicPasswordPath).isFile())) {
    throw new GradleException('A configured COSMIC signing file is missing.')
}

android {
    namespace 'com.mundox.cosmic'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.mundox.cosmic'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.3.1'
        testInstrumentationRunner 'com.mundox.cosmic.CosmicInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../../app/src/main/java', '../../graphics-android/app/src/main/java', '../../android-experiments/java']
            res.srcDirs = ['src/main/res', '../../app/src/main/res', '../../graphics-android/app/src/main/res']
            assets.srcDirs = ['src/main/assets', '../../graphics-android/app/src/main/assets', '../../android-experiments/assets']
        }
        androidTest {
            java.srcDirs = ['src/androidTest/java', '../../app/src/androidTest/java', '../../graphics-android/app/src/androidTest/java']
        }
    }
    signingConfigs {
        if (cosmicSigningConfigured) {
            cosmicStable {
                storeFile file(cosmicStorePath)
                storeType 'PKCS12'
                storePassword file(cosmicPasswordPath).getText('UTF-8').trim()
                keyAlias 'mundox'
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (cosmicSigningConfigured) signingConfig signingConfigs.cosmicStable
        }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
