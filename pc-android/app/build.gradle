plugins { id 'com.android.application' }
android {
    namespace 'com.cosmicx.pc'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.cosmicx.pc'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'com.cosmicx.pc.PcInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -O2 -Wall -Wextra'
            arguments '-DANDROID_STL=c++_shared'
        } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../../graphics-android/app/src/main/java']
            java.include 'com/cosmicx/pc/**', 'com/mundox/graphics/NativeCore.java',
                    'com/mundox/graphics/InfiniteProgram.java', 'com/mundox/graphics/EtherCoreNative.java',
                    'com/mundox/graphics/QuantumRenderer.java', 'com/mundox/graphics/RenderResolution.java',
                    'com/mundox/graphics/TilePlan.java', 'com/mundox/graphics/FramePng.java',
                    'com/mundox/graphics/StreamPng.java'
            assets.srcDirs = ['../../graphics-android/app/src/main/assets']
            assets.include 'shaders/**'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
