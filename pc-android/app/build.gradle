plugins { id 'com.android.application' }
// V1 is a separately installable, fully native PC shell. The original
// com.cosmicx.pc/0.4 contract is unchanged unless -PmundoPcV1=true is passed.
def pcV1 = project.findProperty('mundoPcV1')?.toString() == 'true'
def stableStore = System.getenv('MUNDOX_SIGNING_STORE')
def stablePasswordFile = System.getenv('MUNDOX_SIGNING_PASSWORD_FILE')
def signingReady = (stableStore && stablePasswordFile)
if ((stableStore || stablePasswordFile) && !signingReady) {
    throw new GradleException('PC V1 signing requires keystore and password file together.')
}
if (signingReady && (!file(stableStore).isFile() || !file(stablePasswordFile).isFile())) {
    throw new GradleException('Configured PC V1 signing material not found.')
}
android {
    namespace 'com.cosmicx.pc'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId pcV1 ? 'com.cosmicx.pc.v1' : 'com.cosmicx.pc'
        manifestPlaceholders = [pcAppLabel: pcV1 ? 'Mundo X PC V1' : 'COSMIC X PC']
        minSdk 26
        targetSdk 35
        versionCode pcV1 ? 100 : 4
        versionName pcV1 ? '1.0.0' : '0.4.0'
        testInstrumentationRunner 'com.cosmicx.pc.PcInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -O2 -Wall -Wextra'
            arguments '-DANDROID_STL=c++_shared'
        } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../../graphics-android/app/src/main/java']
            java.include 'com/cosmicx/pc/**', 'com/mundox/graphics/NativeCore.java',
                    'com/mundox/graphics/InfiniteProgram.java', 'com/mundox/graphics/EtherCoreNative.java',
                    'com/mundox/graphics/QuantumRenderer.java', 'com/mundox/graphics/RenderResolution.java',
                    'com/mundox/graphics/EditPages.java',
                    'com/mundox/graphics/TilePlan.java', 'com/mundox/graphics/FramePng.java',
                    'com/mundox/graphics/StreamPng.java'
            assets.srcDirs = ['../../graphics-android/app/src/main/assets']
            assets.include 'shaders/**'
        }
    }
    // Extract native ARM64/x86_64 .so files instead of relying on direct
    // mmap from compressed APK entries. Android 16 can then resolve explicit
    // nativeLibraryDir dependencies and report exact loader errors.
    packaging { jniLibs { useLegacyPackaging = true } }
    signingConfigs {
        if (signingReady) {
            pcStable {
                storeFile file(stableStore)
                storeType 'PKCS12'
                storePassword file(stablePasswordFile).getText('UTF-8').trim()
                keyAlias 'mundox'
                keyPassword storePassword
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            debuggable true
            if (signingReady) signingConfig signingConfigs.pcStable
        }
        release { minifyEnabled false }
    }
}
