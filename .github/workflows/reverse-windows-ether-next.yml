name: Ether Next in the canonical Windows guest CPU

on:
  push:
    branches: ["feature/reverse-windows-ether-next-*"]
  pull_request:
    paths:
      - ".github/workflows/reverse-windows-ether-next.yml"
      - "native/include/mundo_x/experimental/ether_transform.hpp"
      - "native/src/ether_*.cpp"
      - "pc-android/native/x86_cpu.hpp"
      - "pc-android/native/sparse_ram.hpp"
      - "pc-android/native/memory_fabric.hpp"
      - "pc-android/native/tests/sparse_ram_test.cpp"
      - "pc-android/native/tests/x86_ram_backing_test.cpp"
      - "pc-android/native/tests/x86_long_null_ss_test.cpp"
      - "pc-android/native/tests/x86_far_transfer64_test.cpp"
      - "pc-android/native/tests/x86_system64_test.cpp"
      - "pc-android/native/boot_hotspots.hpp"
      - "pc-android/native/x86_shift_loop.inc"
      - "native/include/mundo_x/experimental/ether_shift_loop.hpp"
      - "pc-android/native/tests/x86_ether_shift_loop_test.cpp"
      - "pc-android/native/tests/x86_bit_scan_test.cpp"
      - "pc-android/native/tests/x86_invlpg_test.cpp"
      - "pc-android/native/tests/boot_hotspots_test.cpp"
      - "pc-android/CMakeLists.txt"
      - "native/include/mundo_x/experimental/ether_memory_block.hpp"
      - "pc-android/native/x86_ext80.hpp"
      - "pc-android/native/x86_mmx.inc"
      - "pc-android/native/x86_x87_state.inc"
      - "pc-android/native/pc_8042.hpp"
      - "pc-android/native/pc_machine.hpp"
      - "pc-android/native/boot_media.hpp"
      - "pc-android/native/tests/pc_8042_test.cpp"
      - "pc-android/native/tests/pc_iso_test.cpp"
      - "pc-android/native/tests/pc_video_test.cpp"
      - "pc-android/native/tests/x86_bus_c06_test.cpp"
      - "pc-android/native/tests/x86_cpu_profile_test.cpp"
      - "pc-android/native/tests/x86_sse2_packed_oracle_test.cpp"
      - "pc-android/native/tests/x86_c09r1_stage5_cvt_fxsr_test.cpp"
      - "pc-android/native/tests/x86_sse_fp32_test.cpp"
      - "pc-android/native/tests/x86_sse_legacy_forms_test.cpp"
      - "pc-android/native/tests/x86_mmx_test.cpp"
      - "pc-android/native/tests/x86_x87_arithmetic_oracle_test.cpp"
      - "pc-android/native/tests/x86_x87_state_test.cpp"
      - "pc-android/native/tests/x86_c09r1_fxstate_test.cpp"
      - "pc-android/native/tests/x86_c09r1_stage3_x87_mf_test.cpp"
      - "pc-android/native/tests/x86_cpl_c05_test.cpp"
      - "pc-android/native/tests/x86_lock_rmw_test.cpp"
      - "pc-android/native/tests/x86_protected_real_transition_test.cpp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test the original Ether Next and canonical guest integration
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "${{ matrix.architecture }}"
          lscpu | sed -n '/^Vendor ID:/p; /^Model name:/p'
          git rev-parse HEAD
          cmake -S . -B build/ether-next -DCMAKE_BUILD_TYPE=Release -DMUNDO_X_ETHER_NEXT=ON
          cmake --build build/ether-next --parallel 2 \
            --target test_ether_next test_ether_next_quantum x86_ether_next_guest_test
          ctest --test-dir build/ether-next --output-on-failure -V -R '^ether_next'
      - name: Replay protected-mode entry with the inherited stack
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -pthread -I native/include \
            pc-android/native/tests/x86_group6_0f00_test.cpp -o build/ether-next/protected-entry
          build/ether-next/protected-entry | tee build/ether-next/protected-entry.log
          grep -Fq 'protected_entry_stack=1' build/ether-next/protected-entry.log
      - name: Replay protected16-to-real16 CR0 transition and verify descriptor caches
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target x86_protected_real_transition_test
          ctest --test-dir build/ether-next --output-on-failure -V -R '^x86_protected_real_transition$'
      - name: Replay protected32 IA32_TSC reads and verify clock and privileges
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target x86_cpu_profile_test
          ctest --test-dir build/ether-next --output-on-failure -V -R '^x86_cpu_profile$'
      - name: Verify atomic instructions, guest reset signals and boot milestones
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target x86_lock_rmw_test pc_8042_test
          ctest --test-dir build/ether-next --output-on-failure -V -R '^(x86_lock_rmw|pc_8042)$'
      - name: Verify packed integers, SSE arithmetic, conversions and FXSR controls
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target x86_sse2_packed_oracle_test x86_c09r1_stage5_cvt_fxsr_test x86_sse_fp32_test
          ctest --test-dir build/ether-next --output-on-failure -V -R '^(x86_sse2_packed_oracle|x86_c09r1_stage5_cvt_fxsr|x86_sse_fp32)$'
      - name: Verify legacy SSE forms, MMX, x87 and FX state
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target \
            x86_sse_legacy_forms_test x86_mmx_test x86_x87_arithmetic_oracle_test \
            x86_x87_state_test x86_c09r1_fxstate_test x86_c09r1_stage3_x87_mf_test x86_cpl_c05_test
          ctest --test-dir build/ether-next --output-on-failure -V \
            -R '^(x86_sse_legacy_forms|x86_mmx|x86_x87_arithmetic_oracle|x86_x87_state|x86_c09r1_fxstate|x86_c09r1_stage3_x87_mf|x86_cpl_c05)$' \
            | tee build/ether-next/c02-cpu-conformance.log
      - uses: actions/upload-artifact@v4
        with:
          name: c02-cpu-conformance-${{ matrix.architecture }}
          path: build/ether-next/c02-cpu-conformance.log
          if-no-files-found: error
      - name: Verify C03 El Torito firmware, IRQ delivery and guest VGA
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target pc_iso_test pc_video_test x86_bus_c06_test
          ctest --test-dir build/ether-next --output-on-failure -V -R '^(pc_iso|pc_video|x86_bus_c06)$' \
            | tee build/ether-next/c03-firmware-vga.log
      - uses: actions/upload-artifact@v4
        with:
          name: c03-firmware-vga-${{ matrix.architecture }}
          path: build/ether-next/c03-firmware-vga.log
          if-no-files-found: error
      - name: Compare batched guest work, RAM representations and CPU compatibility
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ether-next --parallel 2 --target \
            x86_ether_rep_batch_test x86_ether_shift_loop_test sparse_ram_test boot_hotspots_test x86_ram_backing_test \
            x86_bit_scan_test x86_invlpg_test x86_long_mode_test x86_long_null_ss_test \
            x86_far_transfer64_test x86_system64_test x86_alu64_oracle_test \
            pc_memory_test pc_memory_fabric_test
          ctest --test-dir build/ether-next --output-on-failure -V \
            -R '^(x86_ether_rep_batch|x86_ether_shift_loop|sparse_ram|boot_hotspots|x86_ram_backing|x86_bit_scan|x86_invlpg|x86_long_mode|x86_long_null_ss|x86_far_transfer64|x86_system64|x86_alu64_oracle|pc_memory|pc_memory_fabric)$' \
            | tee build/ether-next/ether-boot-cycles.log
      - uses: actions/upload-artifact@v4
        with:
          name: ether-boot-cycles-${{ matrix.architecture }}
          path: build/ether-next/ether-boot-cycles.log
          if-no-files-found: error
