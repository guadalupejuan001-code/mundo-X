name: MicroLab Android preview
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'native/**', '.github/workflows/micro-lab.yml', 'tools/android/micro-emulator-smoke.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
      - name: Build independent preview and instrumentation
        run: gradle --no-daemon --no-configuration-cache -PmicroPreview :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage preview
        run: |
          mkdir -p micro-apks
          cp app/build/outputs/apk/debug/app-debug.apk micro-apks/Mundo-X-Micro-preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk micro-apks/Micro-instrumentation.apk
          sha256sum micro-apks/Mundo-X-Micro-preview.apk > micro-apks/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mundo-X-Micro-APK
          path: |
            micro-apks/Mundo-X-Micro-preview.apk
            micro-apks/SHA256SUMS.txt
      - name: Verify native models and interaction on Android 15
        run: |
          sudo chmod 666 /dev/kvm
          bash tools/android/micro-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mundo-X-Micro-evidence
          path: micro-evidence/**
