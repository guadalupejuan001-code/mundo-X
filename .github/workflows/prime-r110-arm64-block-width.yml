name: Prime R110 ARM64 compact blocks

on:
  push:
    branches:
      - experiment/r110-arm64-compact-blocks
    paths:
      - .github/workflows/prime-r110-arm64-block-width.yml
      - pc-android/native/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build all three variants from the same source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p out/{control,wide,compact} evidence
          {
            git rev-parse HEAD
            uname -a
            c++ --version
            lscpu
          } > evidence/runner.txt
          flags=(-O2 -DNDEBUG -DMUNDO_X_PC_STATE_RAM=1 -std=c++17 -frounding-math -pthread -I native/include)
          test_source=pc-android/native/tests/x86_ether_arm64_test.cpp
          c++ "${flags[@]}" "$test_source" -o out/control/ether-width
          c++ "${flags[@]}" -DMUNDO_X_ETHER_ARM64_WIDE_BLOCK_EXPERIMENT=1 "$test_source" -o out/wide/ether-width
          c++ "${flags[@]}" -DMUNDO_X_ETHER_ARM64_WIDE_BLOCK_EXPERIMENT=1 \
            -DMUNDO_X_ETHER_ARM64_COMPACT_BLOCK_EXPERIMENT=1 "$test_source" -o out/compact/ether-width
          sha256sum "$test_source" out/{control,wide,compact}/ether-width > evidence/sha256.txt
          file out/{control,wide,compact}/ether-width > evidence/binaries.txt
      - name: Compare all variants on the same ARM64 CPU
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          printf 'pinned_cpu=%s\n' "$cpu" >> evidence/runner.txt
          pair=0
          for order in "control wide compact" "wide compact control" "compact control wide" \
                       "control compact wide" "wide control compact" "compact wide control"; do
            ((pair += 1))
            read -r -a widths <<< "$order"
            for width in "${widths[@]}"; do
              log="evidence/$pair-$width"
              /usr/bin/time -v -o "$log.time" taskset -c "$cpu" "out/$width/ether-width" | tee "$log.log"
              grep -q '^PRIME_C03_ARM64_PASS ' "$log.log"
            done
          done
      - name: Verify equivalent guest work
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from statistics import median

          evidence = Path("evidence")
          tag = "PRIME_ETHER_FORWARD_WIDTH_BENCH "

          def rows(pair, variant):
              lines = (evidence / f"{pair}-{variant}.log").read_text().splitlines()
              values = [json.loads(line.removeprefix(tag)) for line in lines if line.startswith(tag)]
              assert len(values) == 2
              return {value["body_instructions"]: value for value in values}

          summaries = {}
          variants = ("control", "wide", "compact")
          for body in (4, 27):
              times = {variant: [] for variant in variants}
              results = []
              for pair in range(1, 7):
                  result = {variant: rows(pair, variant)[body] for variant in variants}
                  control, wide, compact = (result[variant] for variant in variants)
                  assert (control["max_instructions"], control["max_bytes"]) == (16, 64)
                  assert all((r["max_instructions"], r["max_bytes"]) == (32, 128) for r in (wide, compact))
                  assert all(control[k] == wide[k] == compact[k] for k in ("steps_per_trial", "checksum", "flags"))
                  assert tuple(result[v]["native_blocks_per_body"] for v in variants) == (
                      1 if body == 4 else 2, 1, 1
                  )
                  assert control["cache_sets"] == wide["cache_sets"] == compact["cache_sets"]
                  assert compact["cache_metadata_bytes"] <= control["cache_metadata_bytes"] < wide["cache_metadata_bytes"]
                  for variant in variants:
                      times[variant].append(result[variant]["native_median_ns"])
                  results.append({"pair": pair, **result})
              def paired_change(experiment, reference):
                  return median(100 * (value / base - 1) for value, base in zip(times[experiment], times[reference]))
              summaries[str(body)] = {
                  "median_ns": {variant: median(samples) for variant, samples in times.items()},
                  "wide_time_change_vs_control_pct": paired_change("wide", "control"),
                  "compact_time_change_vs_control_pct": paired_change("compact", "control"),
                  "compact_time_change_vs_wide_pct": paired_change("compact", "wide"),
                  "pairs": results,
              }
          result = json.dumps(summaries, indent=2)
          (evidence / "summary.json").write_text(result + "\n")
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-r110-arm64-compact-block-width
          path: evidence
          if-no-files-found: error
