name: Build Mundo X Lab APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'native/**'
      - 'CMakeLists.txt'
      - 'tools/android/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 'Optional successful APK build run to reuse for UI checks'
        required: false
        default: ''
        type: string
      large_scene_only:
        description: 'Run the dedicated 1,048,576-object regression instead of the regular suite'
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_run == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Native cluster benchmark
        shell: bash
        run: |
          cmake -S . -B native-build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build -j2
          ctest --test-dir native-build --output-on-failure
          ./native-build/mundo_x run examples/measurement_bell.x
          ./native-build/mundo_x run examples/measurement_interference.x
          echo "=== 4x4 cluster: Compact vs Dense ==="
          ./native-build/mundo_x cluster 4 4 --dense
          echo "=== 32x32 cluster: Compact ==="
          ./native-build/mundo_x cluster 32 32
          echo "=== Compact quantum teleportation ==="
          ./native-build/mundo_x teleport
          echo "=== Exact T decomposition: 1 T ==="
          ./native-build/mundo_x t-experiment 3 1
          echo "=== Exact T decomposition: 4 T ==="
          ./native-build/mundo_x t-experiment 4 4
          echo "=== Exact T decomposition: 8 T ==="
          ./native-build/mundo_x t-experiment 4 8
          echo "=== Exact T decomposition: 10 T ==="
          ./native-build/mundo_x t-experiment 4 10
          echo "=== Exact T decomposition: 12 T ==="
          ./native-build/mundo_x t-experiment 4 12
          echo "=== Exact T decomposition: 6 qubits / 12 T ==="
          ./native-build/mundo_x t-experiment 6 12
          echo "=== Reduced exact T: 4 qubits / 12 T ==="
          ./native-build/mundo_x t-reduced-experiment 4 12
          echo "=== Reduced exact T: 6 qubits / 12 T ==="
          ./native-build/mundo_x t-reduced-experiment 6 12
          echo "=== Reduced exact T: 8 qubits / 24 T ==="
          ./native-build/mundo_x t-reduced-experiment 8 24
          echo "=== Reduced exact T: 8 qubits / 64 T ==="
          ./native-build/mundo_x t-reduced-experiment 8 64
          echo "=== Gate-by-gate reduced T trace: 8 qubits / 12 T ==="
          ./native-build/mundo_x t-trace 8 12
          echo "=== Magic-state witness ==="
          ./native-build/mundo_x magic-witness
          echo "=== Independent gate-growth trace: 8 qubits / 12 T ==="
          ./native-build/mundo_x t-trace-variant 8 12

      - name: Install Android packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare persistent project signing
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          MUNDOX_ANDROID_KEYSTORE_B64: ${{ secrets.MUNDOX_ANDROID_KEYSTORE_B64 }}
          MUNDOX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MUNDOX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$MUNDOX_ANDROID_KEYSTORE_B64" || -z "$MUNDOX_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'CI preview uses a temporary debug key. Official delivery is signed separately.'
            exit 0
          fi
          printf '%s' "$MUNDOX_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mundox-signing.p12"
          printf '%s' "$MUNDOX_ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/mundox-signing-password.txt"
          echo "MUNDOX_SIGNING_STORE=$RUNNER_TEMP/mundox-signing.p12" >> "$GITHUB_ENV"
          echo "MUNDOX_SIGNING_PASSWORD_FILE=$RUNNER_TEMP/mundox-signing-password.txt" >> "$GITHUB_ENV"

      - name: Build signed debug APK and UI instrumentation
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mundox-signing.p12" "$RUNNER_TEMP/mundox-signing-password.txt"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/XLab-0.3.2-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/XLab-instrumentation.apk
          sha256sum dist/XLab-0.3.2-debug.apk > dist/XLab-SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-X-Lab-APK
          path: |
            dist/XLab-0.3.2-debug.apk
            dist/XLab-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload UI instrumentation
        uses: actions/upload-artifact@v4
        with:
          name: XLab-Instrumentation
          path: dist/XLab-instrumentation.apk
          if-no-files-found: error

  ui-smoke:
    needs: build-apk
    if: ${{ always() && (needs['build-apk'].result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: Mundo-X-Lab-APK
          path: ui-apks
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run || github.run_id }}

      - name: Download instrumentation
        uses: actions/download-artifact@v4
        with:
          name: XLab-Instrumentation
          path: ui-apks
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run || github.run_id }}

      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"

      - name: Run interactive laboratory on Android 15
        shell: bash
        env:
          XLAB_LARGE_SCENE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.large_scene_only && 'true' || 'false' }}
        run: bash tools/android/xlab-emulator-smoke.sh

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XLab-UI-Evidence
          path: ui-evidence/**
          if-no-files-found: warn
