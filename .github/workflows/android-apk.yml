name: Build Mundo X Lab APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'native/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Native cluster benchmark
        shell: bash
        run: |
          cmake -S . -B native-build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build -j2
          echo "=== 4x4 cluster: Compact vs Dense ==="
          ./native-build/mundo_x cluster 4 4 --dense
          echo "=== 32x32 cluster: Compact ==="
          ./native-build/mundo_x cluster 32 32
          echo "=== Compact quantum teleportation ==="
          ./native-build/mundo_x teleport
          echo "=== Exact T decomposition: 1 T ==="
          ./native-build/mundo_x t-experiment 3 1
          echo "=== Exact T decomposition: 4 T ==="
          ./native-build/mundo_x t-experiment 4 4
          echo "=== Exact T decomposition: 8 T ==="
          ./native-build/mundo_x t-experiment 4 8
          echo "=== Exact T decomposition: 10 T ==="
          ./native-build/mundo_x t-experiment 4 10
          echo "=== Exact T decomposition: 12 T ==="
          ./native-build/mundo_x t-experiment 4 12
          echo "=== Exact T decomposition: 6 qubits / 12 T ==="
          ./native-build/mundo_x t-experiment 6 12
          echo "=== Reduced exact T: 4 qubits / 12 T ==="
          ./native-build/mundo_x t-reduced-experiment 4 12
          echo "=== Reduced exact T: 6 qubits / 12 T ==="
          ./native-build/mundo_x t-reduced-experiment 6 12
          echo "=== Reduced exact T: 8 qubits / 24 T ==="
          ./native-build/mundo_x t-reduced-experiment 8 24
          echo "=== Reduced exact T: 8 qubits / 64 T ==="
          ./native-build/mundo_x t-reduced-experiment 8 64

      - name: Install Android packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mundo-X-Lab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-X-Lab-APK
          path: dist/Mundo-X-Lab-debug.apk
          if-no-files-found: error
