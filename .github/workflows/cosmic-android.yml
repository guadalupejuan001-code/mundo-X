name: COSMIC X Engine unified Android

on:
  push:
    branches: [main]
    paths:
      - 'cosmic-android/**'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'android-experiments/**'
      - 'graphics-android/**'
      - 'native/**'
      - 'tools/cosmic-android-*'
      - 'tools/cosmic-verify-portability.py'
      - '.github/workflows/cosmic-android.yml'
  pull_request:
    paths:
      - 'cosmic-android/**'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'android-experiments/**'
      - 'graphics-android/**'
      - 'native/**'
      - 'tools/cosmic-android-*'
      - 'tools/cosmic-verify-portability.py'
      - '.github/workflows/cosmic-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-unified-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact source being reviewed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Prepare the existing persistent project signing on main
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          MUNDOX_ANDROID_KEYSTORE_B64: ${{ secrets.MUNDOX_ANDROID_KEYSTORE_B64 }}
          MUNDOX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MUNDOX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$MUNDOX_ANDROID_KEYSTORE_B64" || -z "$MUNDOX_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'Preview signing: temporary Android debug key; no persistent key is configured.'
            exit 0
          fi
          printf '%s' "$MUNDOX_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cosmic-signing.p12"
          printf '%s' "$MUNDOX_ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/cosmic-signing-password.txt"
          echo "MUNDOX_SIGNING_STORE=$RUNNER_TEMP/cosmic-signing.p12" >> "$GITHUB_ENV"
          echo "MUNDOX_SIGNING_PASSWORD_FILE=$RUNNER_TEMP/cosmic-signing-password.txt" >> "$GITHUB_ENV"

      - name: Build the unified APK and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          gradle -p cosmic-android --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee cosmic-build.log

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cosmic-signing.p12" "$RUNNER_TEMP/cosmic-signing-password.txt"

      - name: Build the previous app solely for side-by-side installation validation
        shell: bash
        run: |
          set -euo pipefail
          gradle -p graphics-android --no-daemon --stacktrace :app:assembleDebug \
            2>&1 | tee cosmic-coexist-build.log

      - name: Stage and audit the exact installable APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cosmic-dist
          cp cosmic-android/app/build/outputs/apk/debug/app-debug.apk cosmic-dist/COSMIC-X-Engine-0.3.1.apk
          cp cosmic-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            cosmic-dist/COSMIC-X-Engine-0.3.1-tests.apk
          cp graphics-android/app/build/outputs/apk/debug/app-debug.apk cosmic-dist/Mundo-X-Graphics-coexist.apk
          for cosmic_apk in cosmic-dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$cosmic_apk" \
              > "${cosmic_apk%.apk}-signature.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$cosmic_apk" \
              > "${cosmic_apk%.apk}-manifest.txt"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree cosmic-dist/COSMIC-X-Engine-0.3.1.apk \
            --file AndroidManifest.xml > cosmic-dist/app-manifest-tree.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree cosmic-dist/COSMIC-X-Engine-0.3.1-tests.apk \
            --file AndroidManifest.xml > cosmic-dist/test-manifest-tree.txt
          python3 tools/cosmic-android-audit-apk.py cosmic-dist

      - name: Upload the new app and its validation companion
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Engine-0.3.1-APK
          path: cosmic-dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Engine-0.3.1-Build-Logs
          path: |
            cosmic-build.log
            cosmic-coexist-build.log
            cosmic-android/app/build/reports/**
            cosmic-dist/*.txt
            cosmic-dist/*.json
          if-no-files-found: warn
          retention-days: 14

  android-validation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [cosmic, graphics, micro]
    steps:
      - name: Checkout validation code from the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the exact APKs from this build
        uses: actions/download-artifact@v4
        with:
          name: COSMIC-X-Engine-0.3.1-APK
          path: cosmic-apks

      - name: Enable emulator and install Android 15 image
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Exercise the new app with real Android, JNI and GLES
        shell: bash
        env:
          COSMIC_SUITE: ${{ matrix.suite }}
        run: bash tools/cosmic-android-emulator-test.sh

      - name: Independently replay exported projects on desktop
        if: ${{ matrix.suite == 'graphics' }}
        run: python3 tools/cosmic-verify-portability.py cosmic-evidence

      - name: Upload real screens, native comparisons and device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Engine-0.3.1-Android-${{ matrix.suite }}
          path: cosmic-evidence/**
          if-no-files-found: warn
          retention-days: 14
