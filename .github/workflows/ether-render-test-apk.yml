name: Ether Render X test APK

on:
  push:
    branches: [codex/ether-render-test-apk-20261021]
    paths:
      - 'app/**'
      - 'native/include/mundo_x/ether_renderer.hpp'
      - 'native/tests/rule_renderer.cpp'
      - '.github/workflows/ether-render-test-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'native/include/mundo_x/ether_renderer.hpp'
      - 'native/tests/rule_renderer.cpp'
      - '.github/workflows/ether-render-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Native Ether Render oracle
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B render-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build render-build --target test_rule_renderer test_xasm_renderer --parallel 2
          ctest --test-dir render-build -R '^(rule_renderer|xasm_renderer)$' --output-on-failure

      - name: Build standalone device lab
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache -PetherRenderPreview :app:assembleDebug

      - name: Stage APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ether-render-apk
          cp app/build/outputs/apk/debug/app-debug.apk ether-render-apk/Ether-Render-X-Device-Lab.apk
          sha256sum ether-render-apk/Ether-Render-X-Device-Lab.apk | tee ether-render-apk/SHA256SUMS.txt
          cat > ether-render-apk/README.txt <<'EOF'
          Ether Render X Device Lab
          Package: com.mundox.etherrender
          Renderer: native EtherRenderer v0.2 CPU/JNI path
          Tests: region candidates, distance pruning, tile training, brute-force exactness
          Scenes: basic 3 bodies, solar-like 23, stress 64, occlusion 64
          This APK does not claim GPU FPS; render_ms measures the native CPU render call.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: Ether-Render-X-Device-Lab
          path: ether-render-apk/**
          if-no-files-found: error
