name: REgraphics C04 GLES materialization

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/mundox/lab/GpuVisualActivity.java'
      - 'app/src/androidTest/java/com/mundox/lab/XLabInstrumentation.java'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/QuantumRenderer.java'
      - 'graphics-android/app/src/androidTest/java/com/mundox/graphics/GraphicsInstrumentation.java'
      - 'docs/ether-render-x.md'
      - '.github/workflows/regraphics-c04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build XLab app and instrumentation
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage exact XLab artifacts
        shell: bash
        run: |
          mkdir -p c04-xlab
          cp app/build/outputs/apk/debug/app-debug.apk c04-xlab/XLab-0.3.2-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk c04-xlab/XLab-instrumentation.apk
          sha256sum c04-xlab/*.apk | tee c04-xlab/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: REgraphics-C04-XLab-APKs
          if-no-files-found: error
          path: c04-xlab/

      - name: Export exact validated C04 APK to delivery branch
        shell: bash
        run: |
          set -euo pipefail
          expected="26913f6cf9d148f05cbecfcdef7d9667042630f588fc453a2e2fde81404d0ff8"
          actual="$(sha256sum c04-xlab/XLab-0.3.2-debug.apk | awk '{print $1}')"
          test "$actual" = "$expected"
          git fetch origin artifact/regraphics-c04-xlab-export-20261111
          git worktree add /tmp/c04-export -B artifact/regraphics-c04-xlab-export-20261111 origin/artifact/regraphics-c04-xlab-export-20261111
          mkdir -p /tmp/c04-export/c04-delivery
          cp c04-xlab/XLab-0.3.2-debug.apk /tmp/c04-export/c04-delivery/XLab-REgraphics-C04.apk
          printf '%s  %s\n' "$actual" "XLab-REgraphics-C04.apk" > /tmp/c04-export/c04-delivery/SHA256SUMS.txt
          git -C /tmp/c04-export config user.name "github-actions[bot]"
          git -C /tmp/c04-export config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/c04-export add c04-delivery/XLab-REgraphics-C04.apk c04-delivery/SHA256SUMS.txt
          if ! git -C /tmp/c04-export diff --cached --quiet; then
            git -C /tmp/c04-export commit -m "Export validated REgraphics C04 APK"
            git -C /tmp/c04-export push origin HEAD:artifact/regraphics-c04-xlab-export-20261111
          fi

  xlab-gles-validation:
    needs: build-xlab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: REgraphics-C04-XLab-APKs
          path: ui-apks
      - name: Enable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'emulator' 'platform-tools' 'system-images;android-35;default;x86_64'
      - name: Run XLab GLES instrumentation
        shell: bash
        run: bash tools/android/xlab-emulator-smoke.sh
      - name: Assert C04 evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'xlab-regraphics-effects.txt' <(find ui-evidence -type f -printf '%f\n')
          test -f ui-evidence/xlab-regraphics-effects.txt
          grep -q 'policy_96000=4' ui-evidence/xlab-regraphics-effects.txt
          grep -q 'divisor=2' ui-evidence/xlab-regraphics-effects.txt
          grep -q 'reused=true' ui-evidence/xlab-regraphics-effects.txt
          grep -q 'enabled=false' ui-evidence/xlab-regraphics-effects.txt
      - name: Upload C04 XLab GLES evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REgraphics-C04-XLab-GLES-Evidence
          if-no-files-found: warn
          path: ui-evidence/**

  build-graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install graphics Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             'platforms;android-35' 'build-tools;35.0.0'             'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build graphics APK and instrumentation
        shell: bash
        run: |
          gradle -p graphics-android --no-daemon --stacktrace             :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage graphics artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c04-graphics-apks
          cp graphics-android/app/build/outputs/apk/debug/app-debug.apk c04-graphics-apks/COSMIC-X-Engine.apk
          cp graphics-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk             c04-graphics-apks/COSMIC-X-Engine-tests.apk
          sha256sum c04-graphics-apks/COSMIC-X-Engine.apk c04-graphics-apks/COSMIC-X-Engine-tests.apk             | sed 's#c04-graphics-apks/##' > c04-graphics-apks/SHA256SUMS.txt
          git rev-parse HEAD > c04-graphics-apks/build-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: REgraphics-C04-Graphics-APKs
          if-no-files-found: error
          path: c04-graphics-apks/

  graphics-gles-validation:
    needs: build-graphics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: REgraphics-C04-Graphics-APKs
          path: c04-graphics-apks
      - name: Enable graphics Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
      - name: Run physical GLES/scissor instrumentation
        shell: bash
        env:
          GRAPHICS_APK_DIR: c04-graphics-apks
          GRAPHICS_EVIDENCE_DIR: c04-graphics-evidence
          GRAPHICS_TEST_TIMEOUT: '1000'
        run: bash tools/graphics-emulator-test.sh
      - name: Upload C04 graphics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REgraphics-C04-Graphics-GLES-Evidence
          if-no-files-found: warn
          path: c04-graphics-evidence/**
