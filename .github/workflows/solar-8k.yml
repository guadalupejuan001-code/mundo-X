name: COSMIC X Solar 8K, hyperreal rendering and Android validation

on:
  push:
    branches: [main, codex/cosmic-solar-8k-atmospheres-20261019]
    paths:
      - 'solar-android/**'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/NativeCore.java'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/InfiniteProgram.java'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/RenderResolution.java'
      - 'graphics-android/app/src/main/cpp/graphics_jni.cpp'
      - 'native/**'
      - 'tools/solar-*'
      - 'tools/cosmic_source_provenance.py'
      - '.github/workflows/solar-8k.yml'
  pull_request:
    paths:
      - 'solar-android/**'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/NativeCore.java'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/InfiniteProgram.java'
      - 'graphics-android/app/src/main/java/com/mundox/graphics/RenderResolution.java'
      - 'graphics-android/app/src/main/cpp/graphics_jni.cpp'
      - 'native/**'
      - 'tools/solar-*'
      - 'tools/cosmic_source_provenance.py'
      - '.github/workflows/solar-8k.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-solar-8k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact source and integrated core references
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run analytical astronomy, gravity, flight and magnetic invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p solar-science-classes
          javac -encoding UTF-8 -d solar-science-classes \
            solar-android/app/src/main/java/com/mundox/solar/SolarData.java \
            solar-android/app/src/main/java/com/mundox/solar/SolarEnvironment.java \
            solar-android/app/src/main/java/com/mundox/solar/SolarFlightPhysics.java \
            solar-android/tests/SolarDataChecks.java
          java -cp solar-science-classes com.mundox.solar.SolarDataChecks | tee solar-science.log

      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Build the normal solar app for coinstallation validation
        shell: bash
        run: |
          set -euo pipefail
          gradle -p solar-android --no-daemon --stacktrace :app:assembleDebug \
            2>&1 | tee solar-8k-companion-build.log
          mkdir -p solar-8k-dist
          cp solar-android/app/build/outputs/apk/debug/app-debug.apk \
            solar-8k-dist/COSMIC-X-Solar-coexist.apk

      - name: Build the independently installable 8K app and instrumented tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p solar-android --no-daemon --stacktrace -Psolar8kStandalone=true \
            :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee solar-8k-build.log
          cp solar-android/app/build/outputs/apk/debug/app-debug.apk \
            solar-8k-dist/COSMIC-X-Solar-8K.apk
          cp solar-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            solar-8k-dist/COSMIC-X-Solar-8K-tests.apk

      - name: Verify packaged identity, SDK, signatures, ABIs and integrated native sources
        shell: bash
        run: |
          set -euo pipefail
          cp solar-science.log solar-8k-dist/solar-science.log
          python3 tools/solar-stage-8k.py solar-8k-dist

      - name: Upload exact standalone APKs and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Solar-8K-APK
          path: solar-8k-dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Solar-8K-Build-Logs
          path: |
            solar-8k-*.log
            solar-science.log
            solar-8k-dist/*.txt
            solar-8k-dist/*.json
            solar-android/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

  android-validation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the exact validation code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download this build's exact APKs
        uses: actions/download-artifact@v4
        with:
          name: COSMIC-X-Solar-8K-APK
          path: solar-8k-apks

      - name: Enable Android 15 emulator with 2 GB RAM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Verify 13 legacy and 2 focused 8K/entry tests on real Android
        shell: bash
        env:
          SOLAR_UHD8K: 'true'
          SOLAR_APK_DIR: solar-8k-apks
          SOLAR_EVIDENCE_DIR: solar-8k-evidence
        run: bash tools/solar-emulator-test.sh

      - name: Upload actual 8K frames, comparisons, native evidence and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Solar-8K-Android-Evidence
          path: solar-8k-evidence/**
          if-no-files-found: warn
          retention-days: 14
