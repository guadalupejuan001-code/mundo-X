name: Solar exact integration and paired Android performance
on:
  push:
    branches: [main, codex/solar-integration-20261020]
    paths: ['solar-android/**', 'native/**', 'graphics-android/**', 'tools/solar_*', '.github/workflows/solar-performance.yml']
  pull_request:
    paths: ['solar-android/**', 'native/**', 'graphics-android/**', 'tools/solar_*', '.github/workflows/solar-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solar-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-solar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Exact Java geometry, physics and shared native JNI
        run: bash tools/solar_host_checks.sh | tee solar-host.log
      - name: Android toolchain and 2 GB emulator
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' \
            'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build original source with identical instrumentation
        run: |
          git worktree add --detach ../solar-before af0b1797573b55a739dcaef7b784eb98825ff07c
          cp solar-android/app/src/androidTest/java/com/mundox/solar/{SolarInstrumentation,SolarPerformanceChecks}.java \
            ../solar-before/solar-android/app/src/androidTest/java/com/mundox/solar/
          gradle -p ../solar-before/solar-android --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build integrated original module
        run: gradle -p solar-android --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Paired exact captures and completed Android frames
        run: |
          python tools/solar_performance_android.py --sdk "$ANDROID_HOME" \
            --baseline ../solar-before/solar-android/app/build/outputs/apk \
            --after solar-android/app/build/outputs/apk --output solar-performance-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Solar-paired-APK-and-evidence
          path: |
            solar-performance-evidence/**
            solar-host.log
            solar-android/app/build/outputs/apk/debug/*.apk
            solar-android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
