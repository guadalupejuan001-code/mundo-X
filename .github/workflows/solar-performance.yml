name: Solar defined filtering and exact Android integration
on:
  push:
    branches: [main, codex/solar-integration-20261020]
    paths: ['solar-android/**', 'native/**', 'graphics-android/**', 'tools/solar_*', 'tools/test_solar_performance_runner.py', '.github/workflows/solar-performance.yml']
  pull_request:
    paths: ['solar-android/**', 'native/**', 'graphics-android/**', 'tools/solar_*', 'tools/test_solar_performance_runner.py', '.github/workflows/solar-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solar-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-solar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Runner timeout regression checks
        run: python3 tools/test_solar_performance_runner.py
      - name: Exact Java geometry, physics and shared native JNI
        run: bash tools/solar_host_checks.sh | tee solar-host.log
      - name: Independent gradient oracle and exact defined-reference GLES
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri python3-numpy python3-pil strace
          export OPENBLAS_NUM_THREADS=1 LP_NUM_THREADS=1
          /usr/bin/python3 tools/solar_gradients_check.py --output solar-gradients.json
          /usr/bin/python3 tools/solar_shader_check.py \
            --fixtures results/solar-integration-2026-10-20/shipping/fixtures-native-320.json \
            --baseline-shader solar-android/tests/fixtures/solar-defined-reference.frag \
            --warmup-frames 2 --repeats 3 --output solar-defined-host.json
          /usr/bin/python3 tools/solar_shader_check.py \
            --fixtures solar-android/tests/fixtures/solar-android-case-7.json \
            --baseline-shader solar-android/tests/fixtures/solar-defined-reference.frag \
            --warmup-frames 2 --repeats 3 --output solar-exact-android-host.json
          /usr/bin/python3 tools/solar_shader_check.py \
            --fixtures solar-android/tests/fixtures/solar-android-cases-1-2.json \
            --baseline-shader solar-android/tests/fixtures/solar-defined-reference.frag \
            --warmup-frames 2 --repeats 3 --output solar-exact-android-cases12.json
      - name: Android toolchain and 2 GB emulator
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' \
            'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build full-evaluation reference with the same defined filtering
        run: |
          git worktree add --detach ../solar-before af0b1797573b55a739dcaef7b784eb98825ff07c
          cp solar-android/tests/fixtures/solar-defined-reference.frag \
            ../solar-before/solar-android/app/src/main/assets/shaders/solar.frag
          cp solar-android/app/src/androidTest/java/com/mundox/solar/{SolarInstrumentation,SolarPerformanceChecks}.java \
            ../solar-before/solar-android/app/src/androidTest/java/com/mundox/solar/
          gradle -p ../solar-before/solar-android --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build integrated original module
        run: gradle -p solar-android --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Independent lossless PNG decode
        run: |
          mkdir -p build/solar-png
          solar_classes=solar-android/app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          solar_android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -cp "$solar_classes:$solar_android_jar" -d build/solar-png solar-android/tests/SolarPngChecks.java
          java -Xmx256m -cp "build/solar-png:$solar_classes:$solar_android_jar" com.mundox.solar.SolarPngChecks
      - name: Paired exact captures in the declared deterministic software driver
        run: |
          python tools/solar_performance_android.py --sdk "$ANDROID_HOME" \
            --baseline ../solar-before/solar-android/app/build/outputs/apk \
            --after solar-android/app/build/outputs/apk --output solar-performance-evidence \
            --swiftshader-threads 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Solar-paired-APK-and-evidence
          path: |
            solar-performance-evidence/**
            solar-host.log
            solar-gradients.json
            solar-defined-host.json
            solar-exact-android-host.json
            solar-exact-android-cases12.json
            solar-android/tests/fixtures/solar-defined-reference.frag
            solar-android/app/build/outputs/apk/debug/*.apk
            solar-android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
