name: Build Mundo X Windows 10 x64

on:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-x64.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Compare original and diagnostic reference tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force compiler-check | Out-Null
          git show f6c5614e110e4e99b4e69466bb9d5e0abe4abdb8:native/tests/reduced_optimization.cpp | Set-Content -Encoding utf8 compiler-check/original.cpp
          @'
          cmake_minimum_required(VERSION 3.16)
          project(reduced_compiler_check LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          foreach(mode IN ITEMS original original_noinline original_unoptimized diagnostic)
            if(mode STREQUAL "diagnostic")
              add_executable(${mode} ../native/tests/reduced_optimization.cpp)
            else()
              add_executable(${mode} original.cpp)
            endif()
            target_include_directories(${mode} PRIVATE ../native/include)
            if(mode STREQUAL "original_noinline")
              target_compile_options(${mode} PRIVATE /Ob0)
            elseif(mode STREQUAL "original_unoptimized")
              target_compile_options(${mode} PRIVATE /Od)
            endif()
          endforeach()
          '@ | Set-Content -Encoding utf8 compiler-check/CMakeLists.txt
          cmake -S compiler-check -B compiler-check/build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build compiler-check/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($mode in @("original", "original_noinline", "original_unoptimized", "diagnostic")) {
            foreach ($repeat in 1..3) {
              Write-Output "COMPARE mode=$mode repeat=$repeat"
              & ".\compiler-check\build\Release\$mode.exe"
              Write-Output "COMPARE_RESULT mode=$mode repeat=$repeat exit=$LASTEXITCODE"
            }
          }
          exit 0

      - name: Smoke tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\Release\mundo_x.exe hello
          .\build\Release\mundo_x.exe run examples\bell.x
          .\build\Release\mundo_x.exe cluster 4 4 --dense
          .\build\Release\mundo_x.exe cluster 32 32
          .\build\Release\mundo_x.exe t-experiment 4 4
          .\build\Release\mundo_x.exe t-experiment 4 8
          .\build\Release\mundo_x.exe t-experiment 4 10
          .\build\Release\mundo_x.exe t-experiment 4 12
          .\build\Release\mundo_x.exe t-reduced-experiment 4 12
          .\build\Release\mundo_x.exe t-reduced-experiment 6 12
          .\build\Release\mundo_x.exe t-reduced-experiment 8 24
          .\build\Release\mundo_x.exe t-reduced-experiment 8 64

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\examples | Out-Null
          Copy-Item build\Release\mundo_x.exe dist\mundo_x.exe
          Copy-Item examples\*.x dist\examples\
          @"
          MUNDO X - Windows 10 x64

          Quick start:
            mundo_x.exe hello
            mundo_x.exe bench 1000
            mundo_x.exe cluster 32 32
            mundo_x.exe run examples\bell.x
            mundo_x.exe practice 2

          This build targets Windows x64 and uses the native Compact Core runtime.
          "@ | Out-File -Encoding utf8 dist\WINDOWS-README.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-X-Windows10-x64
          path: dist/**
          if-no-files-found: error
