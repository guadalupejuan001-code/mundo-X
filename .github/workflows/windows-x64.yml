name: Build Mundo X Windows 10 x64

on:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - 'pc-android/**'
      - 'android-experiments/native/**'
      - 'examples/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'tools/windows/**'
      - '.github/workflows/windows-x64.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'pc-android/**'
      - 'android-experiments/native/**'
      - 'examples/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'tools/windows/**'
      - '.github/workflows/windows-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Native core and XASM tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke tests
        shell: pwsh
        run: |
          .\build\Release\mundo_x.exe hello
          .\build\Release\mundo_x.exe run examples\bell.x
          .\build\Release\mundo_x.exe run examples\measurement_bell.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\Release\mundo_x.exe run examples\measurement_interference.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\Release\mundo_x.exe run-mx examples\mx_layers.mx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\Release\mundo_x_phase.exe examples\adder50.qx adaptive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\Release\mundo_x.exe cluster 4 4 --dense
          .\build\Release\mundo_x.exe cluster 32 32
          .\build\Release\mundo_x.exe t-experiment 4 4
          .\build\Release\mundo_x.exe t-experiment 4 8
          .\build\Release\mundo_x.exe t-experiment 4 10
          .\build\Release\mundo_x.exe t-experiment 4 12
          .\build\Release\mundo_x.exe t-reduced-experiment 4 12
          .\build\Release\mundo_x.exe t-reduced-experiment 6 12
          .\build\Release\mundo_x.exe t-reduced-experiment 8 24
          .\build\Release\mundo_x.exe t-reduced-experiment 8 64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\Release\mundo_x_vm.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\pc-android\Release\cosmic_pc_cli.exe --demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\pc-android\Release\cosmic_pc_cli.exe --demo64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\examples | Out-Null
          Copy-Item build\Release\mundo_x.exe dist\mundo_x.exe
          Copy-Item build\Release\mundo_x_phase.exe dist\mundo_x_phase.exe
          Copy-Item build\Release\mundo_x_vm.exe dist\mundo_x_vm.exe
          Copy-Item build\pc-android\Release\cosmic_pc_cli.exe dist\cosmic_pc_cli.exe
          Copy-Item examples\*.x dist\examples\
          Copy-Item examples\*.mx dist\examples\
          Copy-Item examples\*.qx dist\examples\
          Copy-Item tools\windows\INICIAR.cmd dist\INICIAR.cmd
          Copy-Item tools\windows\LEEME.txt dist\LEEME.txt
          $exeHash = (Get-FileHash dist\mundo_x.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  mundo_x.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          $phaseHash = (Get-FileHash dist\mundo_x_phase.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$phaseHash  mundo_x_phase.exe" | Out-File -Append -Encoding ascii dist\SHA256SUMS.txt
          $vmHash = (Get-FileHash dist\mundo_x_vm.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$vmHash  mundo_x_vm.exe" | Out-File -Append -Encoding ascii dist\SHA256SUMS.txt
          $pcHash = (Get-FileHash dist\cosmic_pc_cli.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$pcHash  cosmic_pc_cli.exe" | Out-File -Append -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-X-Windows10-x64
          path: dist/**
          if-no-files-found: error
