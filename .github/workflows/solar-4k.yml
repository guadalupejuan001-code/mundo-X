name: COSMIC X Solar 4K, atmospheres and Android validation

on:
  push:
    branches: [codex/cosmic-solar-4k-atmospheres-20261019]
    paths:
      - 'solar-android/**'
      - 'tools/solar-*'
      - '.github/workflows/solar-4k.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-solar-4k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact source and original core reference
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preserve all 511 analytical astronomy and magnetic invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p solar-science-classes
          javac -encoding UTF-8 -d solar-science-classes \
            solar-android/app/src/main/java/com/mundox/solar/SolarData.java \
            solar-android/tests/SolarDataChecks.java
          java -cp solar-science-classes com.mundox.solar.SolarDataChecks | tee solar-science.log

      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Build the normal solar app for coinstallation validation
        shell: bash
        run: |
          set -euo pipefail
          gradle -p solar-android --no-daemon --stacktrace :app:assembleDebug \
            2>&1 | tee solar-4k-companion-build.log
          mkdir -p solar-4k-dist
          cp solar-android/app/build/outputs/apk/debug/app-debug.apk \
            solar-4k-dist/COSMIC-X-Solar-coexist.apk

      - name: Build the independently installable 4K app and instrumented tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p solar-android --no-daemon --stacktrace -Psolar4kStandalone=true \
            :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee solar-4k-build.log
          cp solar-android/app/build/outputs/apk/debug/app-debug.apk \
            solar-4k-dist/COSMIC-X-Solar-4K.apk
          cp solar-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            solar-4k-dist/COSMIC-X-Solar-4K-tests.apk

      - name: Verify packaged identity, SDK, signatures, ABIs and unchanged native sources
        shell: bash
        run: |
          set -euo pipefail
          cp solar-science.log solar-4k-dist/solar-science.log
          python3 tools/solar-stage-4k.py solar-4k-dist

      - name: Upload exact standalone APKs and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Solar-4K-APK
          path: solar-4k-dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Solar-4K-Build-Logs
          path: |
            solar-4k-*.log
            solar-science.log
            solar-4k-dist/*.txt
            solar-4k-dist/*.json
            solar-android/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

  android-validation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact validation code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this build's exact APKs
        uses: actions/download-artifact@v4
        with:
          name: COSMIC-X-Solar-4K-APK
          path: solar-4k-apks

      - name: Enable Android 15 emulator with 2 GB RAM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Verify 13 legacy and 6 UHD, entry and map tests on real Android
        shell: bash
        env:
          SOLAR_UHD4K: 'true'
          SOLAR_APK_DIR: solar-4k-apks
          SOLAR_EVIDENCE_DIR: solar-4k-evidence
        run: bash tools/solar-emulator-test.sh

      - name: Upload actual UHD frames, comparisons, native evidence and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Solar-4K-Android-Evidence
          path: solar-4k-evidence/**
          if-no-files-found: warn
          retention-days: 14
