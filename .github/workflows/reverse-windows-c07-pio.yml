name: REVERSE Windows C07 - real PIO CPU regression
on:
  push:
    branches: ["feature/reverse-windows-c07-*"]
  pull_request:
    paths:
      - 'pc-android/native/x86_cpu.hpp'
      - 'pc-android/native/tests/x86_idt_c04_test.cpp'
      - 'pc-android/native/tests/x86_cpl_c05_test.cpp'
      - 'pc-android/native/tests/x86_bus_c06_test.cpp'
      - 'pc-android/native/tests/x86_port_pio_c07_test.cpp'
      - 'pc-android/native/pc_machine.hpp'
      - '.github/workflows/reverse-windows-c07-pio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c07-pio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build C04 plus original CPU regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/c07 build/c07-evidence
          CXX="${CXX:-g++}"
          common=(-std=c++17 -O2 -pthread -I native/include -I pc-android/native)
          for test in x86_port_pio_c07_test x86_bus_c06_test x86_cpl_c05_test x86_idt_c04_test x86_long_mode_test x86_cpu_profile_test x86_group6_0f00_test; do
            "$CXX" "${common[@]}" "pc-android/native/tests/${test}.cpp" -o "build/c07/${test}"
          done
      - name: Execute authentic guest x86 / x64 instruction paths
        shell: bash
        run: |
          set -euo pipefail
          for test in x86_port_pio_c07_test x86_bus_c06_test x86_cpl_c05_test x86_idt_c04_test x86_long_mode_test x86_cpu_profile_test x86_group6_0f00_test; do
            "build/c07/${test}" > "build/c07-evidence/${test}.log" 2>&1 || {
              cat "build/c07-evidence/${test}.log"
              exit 1
            }
            tail -8 "build/c07-evidence/${test}.log"
          done
          grep -q 'REVERSE_WINDOWS_C04_IDT_PASS' build/c07-evidence/x86_idt_c04_test.log
          grep -q 'REVERSE_WINDOWS_C05_CPL3_PASS' build/c07-evidence/x86_cpl_c05_test.log
          grep -q 'REVERSE_WINDOWS_C06_BUS_CPU_PASS' build/c07-evidence/x86_bus_c06_test.log
          grep -q 'REVERSE_WINDOWS_C07_CPU_PIO_PASS' build/c07-evidence/x86_port_pio_c07_test.log
      - name: Run complete original COSMIC PC native suite and demos
        shell: bash
        run: |
          set -euo pipefail
          bash pc-android/tools/test-native.sh > build/c07-evidence/native-full.log 2>&1 || {
            tail -160 build/c07-evidence/native-full.log
            exit 1
          }
          tail -35 build/c07-evidence/native-full.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverse-windows-c07-pio
          path: build/c07-evidence/*.log
          if-no-files-found: warn
