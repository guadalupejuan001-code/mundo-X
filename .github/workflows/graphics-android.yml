name: COSMIC X Engine APK and Android validation

on:
  push:
    branches: [main]
    paths:
      - 'graphics-android/**'
      - 'graphics-desktop/**'
      - 'native/**'
      - 'tools/cosmic-*'
      - 'tools/cosmic_source_provenance.py'
      - 'tools/infinite_device_evidence.py'
      - 'tools/graphics/**'
      - 'tools/graphics-*'
      - '.github/workflows/graphics-android.yml'
  pull_request:
    paths:
      - 'graphics-android/**'
      - 'graphics-desktop/**'
      - 'native/**'
      - 'tools/cosmic-*'
      - 'tools/cosmic_source_provenance.py'
      - 'tools/infinite_device_evidence.py'
      - 'tools/graphics/**'
      - 'tools/graphics-*'
      - '.github/workflows/graphics-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Build APK and built-in instrumentation runner
        shell: bash
        run: |
          set -euo pipefail
          gradle -p graphics-android --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee graphics-build.log

      - name: Stage signed debug APK and verify packaged ABIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p graphics-dist
          cp graphics-android/app/build/outputs/apk/debug/app-debug.apk graphics-dist/COSMIC-X-Engine.apk
          cp graphics-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            graphics-dist/COSMIC-X-Engine-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            graphics-dist/COSMIC-X-Engine.apk > graphics-dist/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            graphics-dist/COSMIC-X-Engine.apk > graphics-dist/apk-manifest.txt
          python3 - <<'PY'
          import hashlib
          import subprocess
          import zipfile
          from pathlib import Path
          directory = Path('graphics-dist')
          with zipfile.ZipFile(directory / 'COSMIC-X-Engine.apk') as apk:
              expected = {'lib/arm64-v8a/libmx_graphics.so', 'lib/x86_64/libmx_graphics.so'}
              found = {name for name in apk.namelist() if name.endswith('/libmx_graphics.so')}
              if found != expected:
                  raise SystemExit(f'Native APK ABIs differ: {found}')
              if apk.testzip() is not None:
                  raise SystemExit('APK ZIP integrity failure')
          names = ('COSMIC-X-Engine.apk', 'COSMIC-X-Engine-tests.apk')
          checksums = ''.join(hashlib.sha256((directory / name).read_bytes()).hexdigest()
                              + '  ' + name + '\n' for name in names)
          (directory / 'SHA256SUMS.txt').write_text(checksums)
          (directory / 'build-commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          print(checksums, end='')
          PY

      - name: Upload APK and instrumentation
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Engine-APK
          path: graphics-dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Engine-Build-Logs
          path: |
            graphics-build.log
            graphics-android/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

  android-validation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the exact APKs from this build
        uses: actions/download-artifact@v4
        with:
          name: COSMIC-X-Engine-APK
          path: graphics-apks

      - name: Enable emulator and install Android 15 image
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Validate actual JNI, GLES, mirrors, frame reuse and saved state
        shell: bash
        env:
          GRAPHICS_MIRRORS: 'true'
        run: bash tools/graphics-emulator-test.sh

      - name: Check Android exports with the desktop project codec
        run: python3 tools/cosmic-verify-portability.py graphics-evidence

      - name: Upload framebuffer comparisons, tests and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-X-Engine-Android-Evidence
          path: graphics-evidence/**
          if-no-files-found: warn
          retention-days: 14
