name: Verify Motor X visual integration

on:
  push:
    paths:
      - 'native/include/mundo_x/visual_scene.hpp'
      - 'native/include/mundo_x/xasm.hpp'
      - 'native/src/main.cpp'
      - 'native/tests/visual_scene.cpp'
      - 'native/tests/xasm_visual.cpp'
      - 'tools/visual/**'
      - 'examples/visual*.x'
      - 'CMakeLists.txt'
      - '.github/workflows/visual-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'tools/visual/**'
      - 'examples/visual*.x'
      - 'CMakeLists.txt'
      - '.github/workflows/visual-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - name: Native regressions
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check Linux CLI
        if: runner.os == 'Linux'
        run: python3 tools/visual/check_visual_cli.py --binary build/mundo_x
      - name: Check Windows CLI
        if: runner.os == 'Windows'
        run: python tools/visual/check_visual_cli.py --binary build/Release/mundo_x.exe

  scene-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare native and Android models
        run: python3 tools/visual/check_scene_bridge.py --output scene-bridge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Motor-X-Scene-Compatibility
          path: scene-bridge.json
          if-no-files-found: warn
