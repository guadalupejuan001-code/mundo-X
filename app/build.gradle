plugins {
    id 'com.android.application'
}

// A parallel install for the visual laboratory, independent of the official app key.
def microPreview = project.hasProperty('microPreview')
def etherRenderPreview = project.hasProperty('etherRenderPreview')

def mundoxSigningStorePath = System.getenv('MUNDOX_SIGNING_STORE')
def mundoxSigningPasswordFilePath = System.getenv('MUNDOX_SIGNING_PASSWORD_FILE')
def mundoxSigningConfigured = mundoxSigningStorePath && mundoxSigningPasswordFilePath
if ((mundoxSigningStorePath || mundoxSigningPasswordFilePath) && !mundoxSigningConfigured) {
    throw new GradleException('Mundo X signing requires both the keystore and password-file paths.')
}
if (mundoxSigningConfigured && (!file(mundoxSigningStorePath).isFile()
        || !file(mundoxSigningPasswordFilePath).isFile())) {
    throw new GradleException('A configured Mundo X signing file is missing.')
}

android {
    namespace 'com.mundox.lab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId etherRenderPreview ? 'com.mundox.etherrender' : (microPreview ? 'com.mundox.micropreview' : 'com.mundox.xlab')
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName etherRenderPreview ? '0.1.0-ether-render-test' : (microPreview ? '0.4.0-micro-preview' : '0.3.2')
        testInstrumentationRunner microPreview ? 'com.mundox.lab.MicroLabInstrumentation' : 'com.mundox.lab.XLabInstrumentation'
        manifestPlaceholders = [
            appLabel: etherRenderPreview ? 'Ether Render X · Test' : (microPreview ? 'Mundo X · Micro' : 'XLab · Objetos+'),
            etherRenderEnabled: etherRenderPreview ? 'true' : 'false',
            xlabEnabled: etherRenderPreview ? 'false' : 'true'
        ]

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
            }
        }
    }

    signingConfigs {
        if (mundoxSigningConfigured) {
            mundoxStable {
                storeFile file(mundoxSigningStorePath)
                storeType 'PKCS12'
                storePassword file(mundoxSigningPasswordFilePath).getText('UTF-8').trim()
                keyAlias 'mundox'
                keyPassword storePassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Local builds without explicit signing paths retain Android's local debug key.
            // Official deliveries use the persistent project key when configured.
            if (mundoxSigningConfigured) {
                signingConfig signingConfigs.mundoxStable
            }
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
