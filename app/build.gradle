plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mundox.lab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.mundox.lab.xlab'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'com.mundox.lab.XLabInstrumentation'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
