plugins { id 'com.android.application' }
def solar4kStandalone = providers.gradleProperty('solar4kStandalone').map { it.toBoolean() }.getOrElse(false)
def solar8kStandalone = providers.gradleProperty('solar8kStandalone').map { it.toBoolean() }.getOrElse(false)
def solarReview = providers.gradleProperty('solarReview').map { it.toBoolean() }.getOrElse(false)
def solarFluidStandalone = providers.gradleProperty('solarFluidStandalone').map { it.toBoolean() }.getOrElse(false)
if ((solar4kStandalone && solar8kStandalone) ||
    (solarFluidStandalone && (solar4kStandalone || solar8kStandalone || solarReview)))
    throw new GradleException('Choose one Solar standalone package')

android {
    namespace 'com.mundox.solar'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId = (solar8kStandalone ? 'com.cosmicx.solar.ultra' :
                         solar4kStandalone ? 'com.cosmicx.solar.uhd' :
                         'com.cosmicx.solar') +
                        (solarFluidStandalone ? '.fluid' : solarReview ? '.review' : '')
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
        manifestPlaceholders = [solarAppLabel:
            solarFluidStandalone ? 'COSMIC X Solar Fluido' :
            (solar8kStandalone ? 'COSMIC X Solar 8K' :
             solar4kStandalone ? 'COSMIC X Solar 4K' : 'COSMIC X Solar') +
                (solarReview ? ' Pruebas' : '')]
        buildConfigField 'int', 'SOLAR_DEFAULT_MODE',
                solarFluidStandalone ? '3' :
                solar8kStandalone ? '2' : solar4kStandalone ? '1' : '0'
        testInstrumentationRunner 'com.mundox.solar.SolarInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }

    // Compile the original owner of CompactCore directly; never fork its JNI API.
    sourceSets {
        main {
            java {
                srcDir '../../graphics-android/app/src/main/java'
                include 'com/mundox/solar/**'
                include 'com/mundox/graphics/NativeCore.java'
                include 'com/mundox/graphics/EtherCoreNative.java'
                include 'com/mundox/graphics/InfiniteProgram.java'
                include 'com/mundox/graphics/RenderResolution.java'
                include 'com/mundox/graphics/StreamPng.java'
                include 'com/mundox/graphics/TilePlan.java'
            }
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
