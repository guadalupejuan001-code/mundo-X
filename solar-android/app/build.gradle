plugins { id 'com.android.application' }
def solar4kStandalone = providers.gradleProperty('solar4kStandalone').map { it.toBoolean() }.getOrElse(false)

android {
    namespace 'com.mundox.solar'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId solar4kStandalone ? 'com.cosmicx.solar.uhd' : 'com.cosmicx.solar'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        manifestPlaceholders = [solarAppLabel: solar4kStandalone ? 'COSMIC X Solar 4K' : 'COSMIC X Solar']
        testInstrumentationRunner 'com.mundox.solar.SolarInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }

    // Compile the original owner of CompactCore directly; never fork its JNI API.
    sourceSets {
        main {
            java {
                srcDir '../../graphics-android/app/src/main/java'
                include 'com/mundox/solar/**'
                include 'com/mundox/graphics/NativeCore.java'
                include 'com/mundox/graphics/InfiniteProgram.java'
                include 'com/mundox/graphics/RenderResolution.java'
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
