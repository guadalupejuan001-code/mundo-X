plugins { id 'com.android.application' }
android {
    namespace 'com.mundox.worldlink.phone'
    compileSdk 35
    defaultConfig {
        // Google Wearable Data Layer: must match watch applicationId and signature.
        applicationId 'com.mundox.worldlink.active'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
