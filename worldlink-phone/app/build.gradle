plugins { id 'com.android.application' }
android {
    namespace 'com.mundox.worldlink.phone'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        // Google Wearable Data Layer: must match watch applicationId and signature.
        applicationId 'com.mundox.worldlink.quantum'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '3.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    buildTypes { debug { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
