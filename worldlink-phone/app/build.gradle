plugins { id 'com.android.application' }
def fieldPrediction = providers.gradleProperty('fieldPrediction').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'com.mundox.worldlink.phone'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        // Google Wearable Data Layer: must match watch applicationId and signature.
        applicationId fieldPrediction ? 'com.mundox.worldlink.field' : 'com.mundox.worldlink.quantum'
        manifestPlaceholders = [launcherActivity: fieldPrediction ? 'com.mundox.worldlink.phone.FieldExperimentActivity' : 'com.mundox.worldlink.phone.MainActivity', appLabel: fieldPrediction ? 'WorldLink Campo' : 'WorldLink · MIL Ether']
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName fieldPrediction ? '1.0.0-field' : '3.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    buildTypes { debug { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
