plugins { id 'com.android.application' }
// Preserve the original COSMIC companion; build an independent WorldLink pair on demand.
def standaloneWorldLink = providers.gradleProperty('standaloneWorldLink').map { it.toBoolean() }.getOrElse(false)
def fieldPrediction = providers.gradleProperty('fieldPrediction').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'com.mundox.worldlink'
    compileSdk 35
    defaultConfig {
        // This ID MUST match the installed phone app for Wear Data Layer pairing.
        applicationId fieldPrediction ? 'com.mundox.worldlink.field' : standaloneWorldLink ? 'com.mundox.worldlink.quantum' : 'com.mundox.graphics'
        manifestPlaceholders = [launcherActivity: fieldPrediction ? 'com.mundox.worldlink.FieldWatchActivity' : 'com.mundox.worldlink.WatchActivity', appLabel: fieldPrediction ? 'WorldLink Campo' : 'WorldLink · MIL Ether']
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName fieldPrediction ? '1.0.0-field' : '2.1.0'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
