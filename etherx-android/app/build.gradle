plugins {
    id 'com.android.application'
}

android {
    namespace 'com.etherx.filelab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.etherx.filelab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
